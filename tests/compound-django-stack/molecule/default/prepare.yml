---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
    - name: Install OpenSSH server (needed for hardenServer)
      ansible.builtin.apt:
        name:
          - openssh-server
          - python3-pip
          - python3-venv
        state: present
    - name: Install Nginx and start it (needed for nginxWebServer reload)
      ansible.builtin.apt:
        name: nginx
        state: present
    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
    - name: Create django user for service fixtures
      ansible.builtin.user:
        name: django
        groups: www-data
        state: present
    - name: Create dummy SSL certificate
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 1
        -newkey rsa:2048
        -keyout /etc/ssl/private/test.key
        -out /etc/ssl/certs/test.pem
        -subj '/CN=test.example.com'
      args:
        creates: /etc/ssl/certs/test.pem
    - name: Create app subdirectory (normally created by git clone)
      ansible.builtin.file:
        path: /opt/testapp/testapp
        state: directory
        mode: '0755'
    - name: Create static directory
      ansible.builtin.file:
        path: /opt/testapp/static
        state: directory
        mode: '0755'

    - name: Create Python venv for test app
      ansible.builtin.command: python3 -m venv /opt/testapp/venv
      args:
        creates: /opt/testapp/venv/bin/python

    - name: Install Celery in test app venv
      ansible.builtin.pip:
        name: celery
        virtualenv: /opt/testapp/venv

    - name: Create minimal test app package
      ansible.builtin.copy:
        dest: /opt/testapp/testapp/__init__.py
        content: |
          from .celery import app
        owner: django
        group: www-data
        mode: '0644'

    - name: Create minimal Celery app
      ansible.builtin.copy:
        dest: /opt/testapp/testapp/celery.py
        content: |
          from celery import Celery

          app = Celery("testapp")
          app.conf.broker_url = "amqp://guest:guest@localhost//"
          app.conf.worker_enable_remote_control = False
          app.conf.worker_cancel_long_running_tasks_on_connection_loss = True
        owner: django
        group: www-data
        mode: '0644'
