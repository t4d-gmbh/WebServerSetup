---
- name: Install required system packages
  become: yes
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - software-properties-common
      - virtualenv
    state: latest
    update_cache: true

- name: Remove legacy Docker trusted keyring from apt_key
  become: yes
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/docker.gpg
    state: absent

- name: Remove legacy Docker apt source list
  become: yes
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Create apt keyring directory
  become: yes
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download Docker GPG key
  become: yes
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: Add Docker apt repository
  become: yes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Update apt and install Docker packages
  become: yes
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: Add user to the docker group
  become: yes
  user:
    name: "{{ dancer_user }}"
    groups: docker
    append: yes

- name: Start and enable Docker service
  become: yes
  service:
    name: docker
    state: started
    enabled: yes

- block:
  - name: Ensure ACL package is installed
    package:
      name: acl
      state: present
    become: yes
  - name: Log into DockerHub
    community.docker.docker_login:
      username: "{{ DOCKER_LOGIN.username }}"
      password: "{{ DOCKER_LOGIN.password }}"
    become: yes
    become_user: "{{ dancer_user }}"
  when: DOCKER_LOGIN is defined
