---
- name: Ensure docker_user exists
  become: yes
  user:
    name: "{{ docker_user }}"
    state: present

- name: Ensure ACL package is installed
  package:
    name: acl
    state: present
  become: yes

- name: Create OpenCPU configuration directory
  become: true
  file:
    path: /data/docker/opencpu
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0755'

- name: Create OpenCPU container directory
  become: true
  file:
    path: /data/docker/opencpu/opencpu
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0755'

- name: Copy local OpenCPU package sources into build context
  become: true
  ansible.builtin.copy:
    src: "{{ package.source }}/"
    dest: "/data/docker/opencpu/opencpu/{{ package_name }}/"
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0755'
  loop: "{{ opencpu.R_PACKAGES | default({}) | dict2items }}"
  loop_control:
    loop_var: package_item
    label: "{{ package_item.key }}"
  vars:
    package_name: "{{ package_item.key }}"
    package: "{{ package_item.value }}"
  when:
    - package.source is defined
    - package.enabled | default(true) | bool
  notify:
    - Run OpenCPU docker compose

- name: Present OpenCPU preload profile
  become: true
  ansible.builtin.template:
    src: Rprofile.j2
    dest: /data/docker/opencpu/opencpu/Rprofile
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0644'
  when: opencpu.PRELOAD_PACKAGES | default([]) | length > 0
  notify:
    - Run OpenCPU docker compose

- name: Remove OpenCPU preload profile when unused
  become: true
  ansible.builtin.file:
    path: /data/docker/opencpu/opencpu/Rprofile
    state: absent
  when: opencpu.PRELOAD_PACKAGES | default([]) | length == 0
  notify:
    - Run OpenCPU docker compose

- name: Present Opencpu container build file
  become: true
  template:
    src: Dockerfile.j2
    dest: /data/docker/opencpu/opencpu/Dockerfile
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0644'
  notify:
    - Run OpenCPU docker compose

- name: Log into DockerHub
  community.docker.docker_login:
    username: "{{ DOCKER_LOGIN.username }}"
    password: "{{ DOCKER_LOGIN.password }}"
  become: yes
  become_user: "{{ docker_user }}"
  when: DOCKER_LOGIN is defined

- name: Pull the container image
  become: True
  community.docker.docker_image:
    name: "{{opencpu.DOCKER_IMAGE | default('docker.io.opencpu/ubuntu-24.04') }}:{{ opencpu.DOCKER_TAG | default ('v2.2.14-2') }}"
    source: pull
  notify:
    - Run OpenCPU docker compose

- name: Present OpenCPU docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /data/docker/opencpu/docker-compose.yml
    owner: "{{ docker_user }}"
    group: "{{ docker_user }}"
    mode: '0644'
  notify:
    - Run OpenCPU docker compose
