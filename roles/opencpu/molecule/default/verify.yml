- name: Verify opencpu
  hosts: all
  become: true
  tasks:
    - name: Check OpenCPU directory exists
      ansible.builtin.stat:
        path: /data/docker/opencpu
      register: opencpu_dir

    - name: Assert OpenCPU directory exists
      ansible.builtin.assert:
        that:
          - opencpu_dir.stat.exists
          - opencpu_dir.stat.isdir
        fail_msg: "OpenCPU directory does not exist"

    - name: Check OpenCPU container directory exists
      ansible.builtin.stat:
        path: /data/docker/opencpu/opencpu
      register: opencpu_container_dir

    - name: Assert container directory exists
      ansible.builtin.assert:
        that:
          - opencpu_container_dir.stat.exists
        fail_msg: "OpenCPU container directory does not exist"

    - name: Check Dockerfile exists
      ansible.builtin.stat:
        path: /data/docker/opencpu/opencpu/Dockerfile
      register: opencpu_dockerfile

    - name: Assert Dockerfile exists
      ansible.builtin.assert:
        that:
          - opencpu_dockerfile.stat.exists
        fail_msg: "OpenCPU Dockerfile does not exist"

    - name: Check docker-compose.yml exists
      ansible.builtin.stat:
        path: /data/docker/opencpu/docker-compose.yml
      register: opencpu_compose

    - name: Assert docker-compose.yml exists
      ansible.builtin.assert:
        that:
          - opencpu_compose.stat.exists
        fail_msg: "OpenCPU docker-compose.yml does not exist"

    - name: Read rendered OpenCPU Dockerfile
      ansible.builtin.slurp:
        src: /data/docker/opencpu/opencpu/Dockerfile
      register: opencpu_dockerfile_content

    - name: Read rendered OpenCPU preload profile
      ansible.builtin.slurp:
        src: /data/docker/opencpu/opencpu/Rprofile
      register: opencpu_rprofile_content

    - name: Assert optional package build configuration is rendered
      ansible.builtin.assert:
        that:
          - "'COPY ABNSCRIPTS /tmp/ABNSCRIPTS' in (opencpu_dockerfile_content.content | b64decode)"
          - '"install_local" in (opencpu_dockerfile_content.content | b64decode)'
          - "'ENV R_LIBS_USER=\" \"' in (opencpu_dockerfile_content.content | b64decode)"
          - "'ENV OCPU_LIBRARY=\"/usr/lib/opencpu/library\"' in (opencpu_dockerfile_content.content | b64decode)"
          - "'COPY Rprofile /etc/opencpu/Rprofile' in (opencpu_dockerfile_content.content | b64decode)"
          - preload_vector_line in (opencpu_rprofile_content.content | b64decode)
          - "'abnScripts' in (opencpu_rprofile_content.content | b64decode)"
          - "'library(package, character.only = TRUE)' in (opencpu_rprofile_content.content | b64decode)"
      vars:
        preload_vector_line: 'packages <- c("abnScripts")'

    # Repository options must precede installation in every R process;
    # configuring pak in a later RUN_R command does not configure remotes.
    - name: Assert fixture exercises all three package installation commands
      ansible.builtin.assert:
        that:
          - installation_lines | length == 3
      vars:
        installation_lines: "{{ (opencpu_dockerfile_content.content | b64decode).splitlines() | select('search', 'install[.]packages|remotes::install_local') | list }}"

    - name: Assert repositories are configured before each package installation
      ansible.builtin.assert:
        that:
          - repository_line in item
          - item.index(repository_line) < item.index('install')
        fail_msg: "Package installation must configure CRAN and INLA in the same R process: {{ item }}"
      loop: "{{ (opencpu_dockerfile_content.content | b64decode).splitlines() | select('search', 'install[.]packages|remotes::install_local') | list }}"
      vars:
        repository_line: 'options(repos=c(\"CRAN\"=\"https://cloud.r-project.org\", \"INLA\"=\"https://inla.r-inla-download.org/R/stable/\"));'

    - name: Check copied local package source
      ansible.builtin.stat:
        path: /data/docker/opencpu/opencpu/ABNSCRIPTS/DESCRIPTION
      register: abnscripts_description

    - name: Assert local package source was copied
      ansible.builtin.assert:
        that:
          - abnscripts_description.stat.exists

    - name: Check OpenCPU container is running
      ansible.builtin.command:
        cmd: docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' opencpu
      register: opencpu_running
      changed_when: false

    - name: Assert OpenCPU container is running
      ansible.builtin.assert:
        that:
          - opencpu_running.stdout == 'true'
        fail_msg: "The customized OpenCPU container is not running"

    - name: Verify package installation and OpenCPU library path
      ansible.builtin.command:
        cmd: >-
          docker exec opencpu R --vanilla -e
          "stopifnot(Sys.getenv('OCPU_LIBRARY') == '/usr/lib/opencpu/library');
          .libPaths(c('/usr/lib/opencpu/library', .libPaths()));
          stopifnot(requireNamespace('abnScripts', quietly=TRUE,
          lib.loc='/usr/lib/opencpu/library'));
          stopifnot(nzchar(find.package('abnScripts',
          lib.loc='/usr/lib/opencpu/library', quiet=TRUE)));
          stopifnot(file.exists('/etc/opencpu/Rprofile'))"
      register: package_installation
      changed_when: false

    - name: Assert package installation succeeded
      ansible.builtin.assert:
        that:
          - package_installation.rc == 0
        fail_msg: "abnScripts was not installed into the OpenCPU image"

    - name: Verify OpenCPU preload profile loads the package
      ansible.builtin.command:
        cmd: >-
          docker exec opencpu R --vanilla -e
          ".libPaths(c('/usr/lib/opencpu/library', .libPaths()));
          source('/etc/opencpu/Rprofile');
          stopifnot('package:abnScripts' %in% search())"
      register: preload_profile
      changed_when: false

    - name: Assert OpenCPU preload profile works
      ansible.builtin.assert:
        that:
          - preload_profile.rc == 0
        fail_msg: "The OpenCPU preload profile did not load abnScripts"

    - name: Read OpenCPU container network configuration
      community.docker.docker_container_info:
        name: opencpu
      register: opencpu_container

    - name: Resolve OpenCPU container IP
      ansible.builtin.set_fact:
        opencpu_container_ip: >-
          {{ (opencpu_container.container.NetworkSettings.Networks
              | dict2items | first).value.IPAddress }}

    - name: Verify OpenCPU preloaded package API
      ansible.builtin.uri:
        url: "http://{{ opencpu_container_ip }}/ocpu/library/abnScripts/R/hello/json"
        method: GET
        return_content: true
        status_code: 200
        use_proxy: false
        timeout: 10
      register: opencpu_api
      changed_when: false
      retries: 12
      delay: 5
      until: opencpu_api.status is defined and opencpu_api.status == 200

    - name: Assert OpenCPU package endpoint works
      ansible.builtin.assert:
        that:
          - opencpu_api.status == 200
          - "'hello' in opencpu_api.content"
        fail_msg: "OpenCPU could not execute abnScripts::hello"
