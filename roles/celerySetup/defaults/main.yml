---
# Subdirectory within /opt/{{ app_name }} that contains manage.py.
# Use "." for repositories where manage.py is at the repository root.
# Use "{{ app_name | lower }}" for the legacy layout where manage.py lives
# inside a subdirectory named after the application.
django_project_subdir: "."

rabbitmq_version: latest
# RabbitMQ container log rotation — prevents the container log from growing unbounded
rabbitmq_log_max_size: "10m"
rabbitmq_log_max_file: "3"
# celery config options
celery_worker_name: "worker1"
celery_time_limit: 300
celery_concurrency: 8
celery_log_level: "DEBUG"
celery_log_file: "/var/log/celery/%n%I.log"
celery_pid_file: "/var/run/celery/%n.pid"
celery_user: "django"
celery_group: "www-data"
