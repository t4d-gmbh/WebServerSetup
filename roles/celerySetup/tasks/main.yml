---
# Ensure we can act as unpriviledged user
- name: Ensure ACL package is installed
  package:
    name: acl
    state: present
  become: yes

- name: Make sure the specific celery user exists
  user:
    name: "{{ celery_user }}"
    shell: /bin/bash
    create_home: yes
    groups:
      - www-data  # Add the user to the www-data group
      - "{{ celery_group }}"
    state: present
  become: yes

- name: Create Celery systemd service file
  template:
    src: celery.service.j2
    dest: /etc/systemd/system/celery.service
  notify:
    - Reload systemd
    - Restart Celery Service
  become: yes

- name: Pull RabbitMQ Docker image
  community.docker.docker_image_pull:
    name: rabbitmq
    tag: "{{ rabbitmq_version }}"
  become: yes

- name: Ensure RabbitMQ config directory exists
  file:
    path: "{{ rabbitmq_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Deploy RabbitMQ config
  template:
    src: rabbitmq.conf.j2
    dest: "{{ rabbitmq_config_dir }}/rabbitmq.conf"
    owner: root
    group: root
    mode: '0644'
  register: rabbitmq_config
  become: yes

- name: Inspect existing RabbitMQ container
  community.docker.docker_container_info:
    name: rabbitmq
  register: rabbitmq_container_info
  become: yes

- name: Remove RabbitMQ container with deprecated memory env vars
  docker_container:
    name: rabbitmq
    state: absent
    force_kill: true
  become: yes
  when:
    - rabbitmq_container_info.exists
    - rabbitmq_container_info.container.Config.Env | select('match', '^RABBITMQ_VM_MEMORY_HIGH_WATERMARK') | list | length > 0

- name: Run RabbitMQ container
  docker_container:
    name: rabbitmq
    image: "rabbitmq:{{ rabbitmq_version }}"
    state: started
    restart_policy: always
    published_ports:
      - "5672:5672"  # RabbitMQ default port
      - "15672:15672"  # RabbitMQ management UI
    memory: "{{ rabbitmq_memory_limit }}"
    env:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - "{{ rabbitmq_config_dir }}/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
    restart: "{{ rabbitmq_config.changed | default(false) }}"
    log_driver: json-file
    log_options:
      max-size: "{{ rabbitmq_log_max_size }}"
      max-file: "{{ rabbitmq_log_max_file }}"
  become: yes

- name: Wait for RabbitMQ AMQP port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5672
    timeout: 60
  become: yes

- name: Deploy the temp files
  template:
    src: celery.conf.j2
    dest: /etc/tmpfiles.d/celery.conf
  become: yes

- name: Ensure conf.d exists
  file:
    path: /etc/conf.d
    state: directory
    mode: '0755'  # Set permissions for the directory
  become: yes

- name: Ensure celery specific folders exist
  file:
    path: "{{ item }}"
    owner: "{{ celery_user }}"
    group: "{{ celery_group }}"
    state: directory
    mode: '0755'  # Set permissions for the directory
  become: yes
  loop:
    - /var/log/celery
    - /var/run/celery

- name: Deploy logrotate config for Celery logs
  become: true
  copy:
    dest: /etc/logrotate.d/{{ app_name | lower }}-celery
    content: |
      /var/log/celery/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }
    owner: root
    group: root
    mode: '0644'

- name: Create celery config file
  template:
    src: celery.j2
    dest: /etc/conf.d/celery
  notify: Restart Celery Service
  become: yes

- name: Start and enable Celery service
  systemd:
    name: celery
    state: started
    enabled: yes
  become: yes
  tags:
    - molecule-notest
