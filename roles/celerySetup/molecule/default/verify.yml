---
- name: Verify celerySetup
  hosts: all
  become: true
  tasks:
    - name: Check celery service file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/celery.service
      register: celery_service

    - name: Assert celery service unit exists
      ansible.builtin.assert:
        that:
          - celery_service.stat.exists
        fail_msg: "celery.service unit file does not exist"

    - name: Check celery log directory exists
      ansible.builtin.stat:
        path: /var/log/celery
      register: celery_log_dir

    - name: Assert celery log directory exists
      ansible.builtin.assert:
        that:
          - celery_log_dir.stat.exists
          - celery_log_dir.stat.isdir
        fail_msg: "celery log directory does not exist"

    - name: Check celery run directory exists
      ansible.builtin.stat:
        path: /var/run/celery
      register: celery_run_dir

    - name: Assert celery run directory exists
      ansible.builtin.assert:
        that:
          - celery_run_dir.stat.exists
          - celery_run_dir.stat.isdir
        fail_msg: "celery run directory does not exist"

    - name: Check celery config file exists
      ansible.builtin.stat:
        path: /etc/conf.d/celery
      register: celery_config

    - name: Assert celery config exists
      ansible.builtin.assert:
        that:
          - celery_config.stat.exists
        fail_msg: "celery config file does not exist"

    - name: Read celery config file
      ansible.builtin.slurp:
        src: /etc/conf.d/celery
      register: celery_config_content

    - name: Assert celery worker options are rendered
      ansible.builtin.assert:
        that:
          - "'--time-limit=300' in (celery_config_content.content | b64decode)"
          - "'--concurrency=4' in (celery_config_content.content | b64decode)"
          - "'--without-gossip' in (celery_config_content.content | b64decode)"
          - "'--without-mingle' in (celery_config_content.content | b64decode)"
          - "'--without-heartbeat' in (celery_config_content.content | b64decode)"
        fail_msg: "celery worker options are not rendered correctly"

    - name: Check ACL is installed
      ansible.builtin.command: dpkg -l acl
      register: acl_check
      changed_when: false

    - name: Assert ACL is installed
      ansible.builtin.assert:
        that:
          - acl_check.rc == 0
        fail_msg: "ACL package is not installed"

    - name: Check logrotate config for Celery exists
      ansible.builtin.stat:
        path: /etc/logrotate.d/testapp-celery
      register: celery_logrotate

    - name: Assert logrotate config exists with correct permissions
      ansible.builtin.assert:
        that:
          - celery_logrotate.stat.exists
          - celery_logrotate.stat.mode == '0644'
        fail_msg: "Celery logrotate config missing or wrong permissions"

    - name: Read logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/testapp-celery
      register: celery_logrotate_content

    - name: Assert logrotate config has correct path and copytruncate
      ansible.builtin.assert:
        that:
          - "'/var/log/celery/*.log' in (celery_logrotate_content.content | b64decode)"
          - "'copytruncate' in (celery_logrotate_content.content | b64decode)"
        fail_msg: "Celery logrotate config has wrong content"

    - name: Inspect RabbitMQ container configuration
      ansible.builtin.command: docker inspect rabbitmq
      register: rabbitmq_inspect
      changed_when: false

    - name: Set RabbitMQ container info fact
      ansible.builtin.set_fact:
        rabbitmq_info: "{{ rabbitmq_inspect.stdout | from_json | first }}"

    - name: Assert RabbitMQ container memory limit is set to 512m
      ansible.builtin.assert:
        that:
          - rabbitmq_info.HostConfig.Memory == 536870912
        fail_msg: "RabbitMQ container memory limit is not 512m (536870912 bytes)"

    - name: Check RabbitMQ config file exists
      ansible.builtin.stat:
        path: /etc/rabbitmq/rabbitmq.conf
      register: rabbitmq_config

    - name: Assert RabbitMQ config file exists with correct permissions
      ansible.builtin.assert:
        that:
          - rabbitmq_config.stat.exists
          - rabbitmq_config.stat.mode == '0644'
        fail_msg: "RabbitMQ config file missing or wrong permissions"

    - name: Read RabbitMQ config file
      ansible.builtin.slurp:
        src: /etc/rabbitmq/rabbitmq.conf
      register: rabbitmq_config_content

    - name: Assert RabbitMQ memory high-watermark config is set
      ansible.builtin.assert:
        that:
          - "'vm_memory_high_watermark.relative = 0.1' in (rabbitmq_config_content.content | b64decode)"
          - "'vm_memory_high_watermark_paging_ratio = 0.8' in (rabbitmq_config_content.content | b64decode)"
        fail_msg: "RabbitMQ VM memory config is not set correctly"

    - name: Assert RabbitMQ config file is mounted into the container
      ansible.builtin.assert:
        that:
          - rabbitmq_info.Mounts | selectattr('Destination', 'equalto', '/etc/rabbitmq/rabbitmq.conf') | list | length == 1
        fail_msg: "RabbitMQ config file is not mounted into the container"

    - name: Assert deprecated RabbitMQ VM memory env vars are absent
      ansible.builtin.assert:
        that:
          - rabbitmq_info.Config.Env | select('match', '^RABBITMQ_VM_MEMORY_HIGH_WATERMARK') | list | length == 0
        fail_msg: "Deprecated RabbitMQ VM memory environment variables are still present"
