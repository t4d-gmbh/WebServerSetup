---
# Subdirectory within /opt/{{ app_name }} that contains manage.py (and wsgi.py).
# Use "." for repositories where manage.py is at the repository root.
# Use "{{ app_name | lower }}" for the legacy layout where manage.py lives
# inside a subdirectory named after the application.
django_project_subdir: "."
# Gunicorn worker memory management — workers are recycled after this many
# requests to prevent unbounded RSS growth from Django memory leaks.
# Jitter staggers restarts to avoid thundering-herd behaviour.
gunicorn_max_requests: 500
gunicorn_max_requests_jitter: 50
