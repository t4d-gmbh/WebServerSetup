---
git_repository_branch: main
db_name: 'my_django_db'
db_host: 'localhost'
db_port: '5432'
db_engine: 'django.db.backends.postgresql'  # 'django.db.backends.sqlite3'
db_user: 'django'
vault_email_config:
  email_host: 'localhost'
  email_port: '587' # 25 without tls 465 for ssl
  email_use_tls: 'True'
  email_host_user: ''
  email_host_password: ''
  email_default_from: ''

# Vite dev mode (set to False for production deployments)
vite_dev_mode: "False"

# Logging
# Global log level applied to all app loggers. Valid values: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: "WARNING"
# Optional absolute path to the log file. The parent directory must exist;
# it is created by this role when non-empty. Leave empty for console-only logging.
log_file: ""
# Optional per-app log level overrides. List of single-key dicts {appname: level}.
# The appname is uppercased and prefixed with LOG_LEVEL_ in the .env file.
# Example:
#   app_log_levels:
#     - backends: DEBUG
#     - bayesian_networks: INFO
app_log_levels: []

# Django project subdirectory — path relative to /opt/{{ app_name }} where manage.py lives.
# Default "." assumes manage.py is at the repository root (standard Django layout).
# Existing deployments with manage.py in a subdirectory must set this explicitly:
#   django_project_subdir: "{{ app_name | lower }}"
django_project_subdir: "."

# Cache
cache_backend: "django.core.cache.backends.db.DatabaseCache"
cache_location: "django_cache"

# Celery specific variables
celery_task_always_eager: "False"

# Extra environment variables appended to the .env file.
# env_extra_vars holds plain (non-secret) key/value pairs.
# vault_env_extra_vars holds secret key/value pairs (store in Ansible Vault).
# Both are merged; vault_env_extra_vars wins on key conflicts.
# Values must not contain single quotes. If a value contains spaces or shell
# special characters ($, #, &, etc.), the single-quote wrapping in the template
# ensures it is bash-safe — no additional escaping needed on the Ansible side.
env_extra_vars: {}
vault_env_extra_vars: {}
