- name: Assert supported distribution and release
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - gitlab_repo_codename in ['jammy', 'noble', 'resolute']
    fail_msg: >-
      GitLab omnibus publishes apt repositories only for Ubuntu 22.04 (jammy),
      24.04 (noble) and 26.04 (resolute). Got {{ ansible_distribution }}
      {{ ansible_distribution_version }}. Use a supported release or the
      official gitlab/gitlab-ce Docker image instead.

- name: Install GitLab prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - perl
      - openssh-server
    state: present
    update_cache: true

- name: Create apt keyring directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download GitLab GPG key
  become: true
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/gpg.key
    dest: /etc/apt/keyrings/gitlab.asc
    owner: root
    group: root
    mode: '0644'

- name: Add GitLab apt repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/gitlab-ce.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://packages.gitlab.com/gitlab/gitlab-ce/ubuntu
      Suites: {{ gitlab_repo_codename }}
      Components: main
      Signed-By: /etc/apt/keyrings/gitlab.asc

# noqa risky-file-permissions - existence only; chef re-attributes /etc/gitlab
# on install, and enforcing mode here broke molecule idempotence.
- name: Create GitLab configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/gitlab
    state: directory

- name: Keep package postinst from running reconfigure
  become: true
  ansible.builtin.copy:
    dest: /etc/gitlab/skip-auto-reconfigure
    content: ""
    mode: '0600'
  when: gitlab_skip_auto_reconfigure

- name: Allow package postinst to run reconfigure
  become: true
  ansible.builtin.file:
    path: /etc/gitlab/skip-auto-reconfigure
    state: absent
  when: not gitlab_skip_auto_reconfigure

- name: Deploy GitLab configuration
  become: true
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: '0600'
  notify: Reconfigure GitLab

- name: Check certificate files exist
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ gitlab_ssl_certificate }}"
    - "{{ gitlab_ssl_certificate_key }}"
  register: gitlab_cert_stat

- name: Assert certbot certificates are in place
  ansible.builtin.assert:
    that:
      - gitlab_cert_stat.results | map(attribute='stat.exists') | select | list | count == 2
    fail_msg: >-
      {{ gitlab_ssl_certificate }} not found. Run the certbot role for
      domain_name={{ gitlab_host }} before this role; GitLab's nginx will not
      start without the DNS-01 certificate.
  tags:
    - molecule-notest

- name: Install GitLab CE
  block:
    - name: Install gitlab-ce package (runs first reconfigure in postinst)
      become: true
      ansible.builtin.apt:
        name:
          - "gitlab-ce={{ gitlab.version }}"
        state: present
        update_cache: true
      notify: Reconfigure GitLab
  rescue:
    # The package postinst swallows chef's output; surface the real error.
    - name: Find reconfigure logs
      become: true
      ansible.builtin.find:
        paths: /var/log/gitlab/reconfigure
        file_type: file
      register: gitlab_reconf_logs
      failed_when: false  # dir absent if chef died before logging

    - name: Resolve latest reconfigure log
      ansible.builtin.set_fact:
        gitlab_latest_reconf_log: >-
          {{ (gitlab_reconf_logs.files | sort(attribute='mtime'))[-1].path
             if (gitlab_reconf_logs.files | default([]) | length) > 0 else '' }}

    - name: Read reconfigure log tail
      become: true
      ansible.builtin.command:
        cmd: "tail -n 80 {{ gitlab_latest_reconf_log }}"
      register: gitlab_reconf_log
      changed_when: false
      failed_when: false
      when: gitlab_latest_reconf_log | length > 0

    - name: Fail with reconfigure log excerpt
      ansible.builtin.fail:
        msg: |-
          gitlab-ce postinst reconfigure failed.
          Latest log: {{ gitlab_latest_reconf_log | default('(none)') }}
          {{ gitlab_reconf_log.stdout | default('no reconfigure log found - inspect /var/log/gitlab/ manually') }}
          Recovery: fix the root cause, then run
            sudo gitlab-ctl reconfigure && sudo dpkg --configure gitlab-ce
          and rerun the playbook.

- name: Ensure GitLab runit service is enabled and running
  become: true
  ansible.builtin.systemd:
    name: gitlab-runsvdir
    enabled: true
    state: started
  when: gitlab_reconfigure
