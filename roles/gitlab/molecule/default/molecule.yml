role_name_check: 1
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
  # WORKAROUND (upstream breakage 2026-10-05): GitLab's resolute publication
  # serves noble's artifacts while its index lists different SHA256/Size, so
  # apt fails on every version. This platform pins the noble suite instead,
  # validating that path end-to-end (noble deb on a real 26.04 host + full
  # postinst chef reconfigure). Remove the override when GitLab republishes
  # resolute.
  - name: instance2604
    image: geerlingguy/docker-ubuntu2604-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  inventory:
    host_vars:
      instance:
        server_url: "https://gitlab.example.com"
        gitlab_reconfigure: false
        vault_gitlab_initial_root_password: "TestPassword123!"
      instance2604:
        server_url: "https://gitlab.example.com"
        gitlab_repo_codename: "noble"
        gitlab_reconfigure: false
        vault_gitlab_initial_root_password: "TestPassword123!"
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
