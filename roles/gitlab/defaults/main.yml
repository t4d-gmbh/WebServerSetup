gitlab:
  version: "19.3.1-ce.0"

# GitLab publishes omnibus apt repositories for Ubuntu 22.04 (jammy),
# 24.04 (noble) and 26.04 (resolute); interim releases (oracular, questing...)
# are not published. Defaults to the host's own release; override only to pin
# a suite deliberately.
gitlab_repo_codename: "{{ ansible_distribution_release }}"

# host extracted from server_url (e.g. https://gitlab.example.com -> gitlab.example.com)
gitlab_host: "{{ server_url | regex_replace('^https?://', '') }}"
gitlab_external_url: "https://{{ gitlab_host }}"

# TLS material issued by the certbot role via DNS-01 (the host itself is not
# publicly reachable, so omnibus' built-in HTTP-01 validation cannot work).
gitlab_ssl_certificate: "/etc/letsencrypt/live/{{ gitlab_host }}/fullchain.pem"
gitlab_ssl_certificate_key: "/etc/letsencrypt/live/{{ gitlab_host }}/privkey.pem"

# Optional: sender address for GitLab notifications (SMTP itself stays
# configured through the standard gitlab_rails['smtp_*'] settings in
# gitlab.rb.j2 overrides or a post-role template extension).
gitlab_email_from: ""

# GitLab boots the full Rails environment to clear its cache at the end of
# every reconfigure. On memory-constrained hosts (<=4 GB without ample swap)
# this can thrash until chef's 3600s timeout kills the postinst. Set false to
# emit gitlab_rails['rake_cache_clear'] = false (GitLab's documented
# memory-constrained-environments knob).
gitlab_rake_cache_clear: true

# Set false to emit prometheus_monitoring['enable'] = false (disables the
# bundled prometheus/grafana/alertmanager/exporter stack; frees ~0.5-1 GB).
gitlab_prometheus_monitoring: true

# Low-memory tuning. Only emitted when set; empty = keep GitLab omnibus
# defaults. See roles/gitlab/README.md "Low-memory tuning".
gitlab_puma_worker_processes: ""
gitlab_sidekiq_max_concurrency: ""
gitlab_postgresql_shared_buffers: ""   # e.g. "256MB"

# /etc/gitlab/skip-auto-reconfigure only suppresses the reconfigure that runs
# on package UPGRADES; a first install always reconfigures from the postinst.
# That is why gitlab.rb is templated BEFORE the package install: the
# unavoidable first run already uses the right configuration. The handler then
# covers later changes and upgrades.
gitlab_skip_auto_reconfigure: true

# Whether the handler actually runs `gitlab-ctl reconfigure`. CI keeps this
# false: the first-install postinst reconfigure already ran (with a stand-in
# certificate from prepare.yml), and a second full chef pass would only burn
# 10+ minutes.
gitlab_reconfigure: true

# vault-provided (optional):
#   vault_gitlab_initial_root_password  root password applied on first
#                                       reconfigure only; when unset, GitLab
#                                       writes /etc/gitlab/initial_root_password
